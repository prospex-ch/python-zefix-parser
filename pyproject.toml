[project]
name = "zefix-parser"
version = "0.1.0"
description = "Typed Python client for Zefix, the Swiss Central Business Name Index (Zentraler Firmenindex)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Prospex", email = "hello@prospex.ch" },
]
requires-python = ">=3.14"
keywords = ["zefix", "swiss", "commercial-register", "handelsregister", "lindas", "sparql", "uid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://prospex.ch"
Repository = "https://github.com/prospex-ch/python-zefix-parser"
Documentation = "https://zefix-parser.readthedocs.io"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
